{% extends 'base.html' %}
{% load static %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}

<div class="container my-5">

  <div class="row g-5 align-items-center">

    <!-- IMAGE -->
    <div class="col-md-6">
      <div class="img-container">
        <img src="{% if product.image %}{{ product.image.url }}{% else %}{% static 'img/placeholder.png' %}{% endif %}" 
             alt="{{ product.name }}">
      </div>
    </div>

    <!-- INFOS -->
    <div class="col-md-6">

      <h1 class="fw-bold product-title">{{ product.name }}</h1>

      <p class="price my-3">{{ product.price }} € </p>

      <p class="text-muted">
        {{ product.description }}
      </p>

      <!-- BOUTON -->
      <form action="{% url 'add_to_cart' product.id %}" method="post" class="mt-4">
        {% csrf_token %}
        <button class="btn btn-main w-100">
          🛒 Ajouter au panier
        </button>
      </form>

      <!-- INFOS -->
      <div class="mt-4 small text-muted">
        <p>✔ Produit premium</p>
        <p>✔ Livraison rapide</p>
        <p>✔ Paiement sécurisé</p>
      </div>

    </div>

  </div>

</div>

<!-- STYLE -->
<style>

.img-container {
  height: 400px;
  overflow: hidden;
  border-radius: 20px;
}

.img-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.5s;
}

.img-container img:hover {
  transform: scale(1.08);
}

.product-title {
  color: #5a3e2b;
}

.price {
  font-size: 1.8rem;
  font-weight: bold;
  color: #111;
}

.btn-main {
  background-color: #5a3e2b;
  color: white;
  border-radius: 30px;
  padding: 12px;
}

.btn-main:hover {
  background-color: #3e2a1d;
}

</style>

{% endblock %}
