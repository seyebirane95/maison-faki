{% extends 'base.html' %}
{% load static %}

{% block title %}Tous les produits{% endblock %}

{% block content %}

<!-- HEADER -->
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">

  <h2 class="fw-bold m-0" style="color:#5a3e2b;">
    Tous les produits
  </h2>

  <!-- SEARCH (optionnel si tu ajoutes backend) -->
  <input type="text" placeholder="🔍 Rechercher..." class="form-control w-auto search-input">

</div>

<!-- PRODUITS -->
<div class="row g-4">

  {% for p in products %}
  <div class="col-12 col-sm-6 col-md-4 col-lg-3">

    <div class="card product-card border-0 h-100 position-relative">

      <!-- BADGE (exemple) -->
      <span class="badge bg-dark position-absolute top-0 start-0 m-2">New</span>

      <!-- IMAGE -->
      <div class="img-container">
        <img src="{% if p.image %}{{ p.image.url }}{% else %}{% static 'img/placeholder.png' %}{% endif %}" 
             alt="{{ p.name }}">
      </div>

      <!-- INFOS -->
      <div class="card-body text-center d-flex flex-column">

        <h6 class="fw-bold">
          <a href="{% url 'product_detail' p.slug %}" class="text-dark text-decoration-none">
            {{ p.name }}
          </a>
        </h6>

        <p class="price mb-3">{{ p.price }} € </p>

        <div class="mt-auto">

          <a href="{% url 'product_detail' p.slug %}" class="btn btn-outline-dark w-100 mb-2">
            Voir détails
          </a>

          <form action="{% url 'add_to_cart' p.id %}" method="post">
            {% csrf_token %}
            <button class="btn btn-main w-100">
              🛒 Ajouter
            </button>
          </form>

        </div>

      </div>

    </div>

  </div>

  {% empty %}
  <div class="text-center">
    <p>Aucun produit disponible</p>
  </div>
  {% endfor %}

</div>

<!-- STYLE -->
<style>

.search-input {
  border-radius: 20px;
  padding: 8px 15px;
}

/* CARD */
.product-card {
  border-radius: 18px;
  overflow: hidden;
  transition: 0.3s;
}

.product-card:hover {
  transform: translateY(-10px);
  box-shadow: 0 15px 35px rgba(0,0,0,0.15);
}

/* IMAGE */
.img-container {
  height: 240px;
  overflow: hidden;
  position: relative;
}

.img-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.4s;
}

.product-card:hover img {
  transform: scale(1.1);
}

/* PRIX */
.price {
  color: #5a3e2b;
  font-weight: bold;
  font-size: 1.1rem;
}

/* BUTTON */
.btn-main {
  background-color: #5a3e2b;
  color: white;
  border-radius: 30px;
}

.btn-main:hover {
  background-color: #3e2a1d;
}

/* BADGE */
.badge {
  font-size: 0.7rem;
  padding: 6px 10px;
  border-radius: 10px;
}

</style>

{% endblock %}
